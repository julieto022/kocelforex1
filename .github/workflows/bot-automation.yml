name: Scheduled bot automation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-bot-automation
  cancel-in-progress: false

jobs:
  run-due-bots:
    if: ${{ vars.BOT_SCHEDULER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke protected bot scheduler
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the CRON_SECRET Actions secret before enabling bot automation."
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 10 \
            --max-time 240 \
            --output /dev/null \
            --write-out "Bot scheduler responded with HTTP %{http_code}\n" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://kocelforex1.vercel.app/api/cron/bots
